<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DocsNDocs Submission Review</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; padding: 0; background-color: #f9fafb; font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; color: #1f2937; }
    .email-wrapper { width: 100%; background-color: #f9fafb; padding: 40px 16px; box-sizing: border-box; }
    .email-container { max-width: 580px; margin: 0 auto; background-color: #ffffff; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 24px rgba(0,0,0,0.08); }
    .email-header { background-color: #1b5e4f; padding: 28px 36px; text-align: center; }
    .accent-bar { height: 4px; background: linear-gradient(90deg, #1b5e4f 0%, #f59e0b 60%, #d97706 100%); }
    .email-content { padding: 36px 36px 28px; }
    .email-content h2 { font-family: 'Playfair Display', serif; font-size: 24px; font-weight: 700; color: #1f2937; margin: 0 0 16px; }
    .email-content p { font-size: 15px; line-height: 1.75; color: #374151; margin: 0 0 14px; }
    .badge { display: inline-block; padding: 5px 18px; border-radius: 20px; font-size: 13px; font-weight: 700; letter-spacing: 0.3px; margin-bottom: 18px; }
    .status-approved { background: #dcfce7; color: #15803d; }
    .status-revision { background: #fef3c7; color: #92400e; }
    .detail-card { background: #f0fdf9; border: 1px solid #d1fae5; border-left: 4px solid #1b5e4f; border-radius: 10px; padding: 18px 22px; margin: 20px 0; }
    .detail-row { font-size: 14px; color: #374151; line-height: 2; margin: 0; }
    .detail-row strong { color: #1b5e4f; font-weight: 600; display: inline-block; min-width: 100px; }
    .feedback-box { background: #fffbeb; border: 1px solid #fde68a; border-left: 4px solid #f59e0b; border-radius: 10px; padding: 16px 20px; margin: 20px 0; }
    .feedback-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.2px; color: #92400e; margin: 0 0 8px; }
    .feedback-text { font-size: 14px; color: #78350f; line-height: 1.7; margin: 0; }
    .email-divider { height: 1px; background: #e5e7eb; margin: 24px 0; }
    .signature { font-size: 14px; color: #374151; }
    .signature strong { color: #1b5e4f; }
    .email-footer { background: #f9fafb; border-top: 1px solid #e5e7eb; padding: 20px 36px; text-align: center; }
    .email-footer p { font-size: 12px; color: #9ca3af; margin: 0 0 4px; }
    .email-footer a { color: #1b5e4f; text-decoration: none; }
  </style>
</head>
<body>
  <div class="email-wrapper">
    <div class="email-container">

      <div class="email-header">
        <img src="{{EMAIL_LOGO_URL}}" width="180" height="50" alt="DocsNDocs" style="display:block;width:180px;height:50px;margin:0 auto;border:0;object-fit:contain;" />
      </div>
      <div class="accent-bar"></div>

      <div class="email-content">
        <h2>Submission Reviewed</h2>
        <p>Dear {{COLLABORATOR_NAME}},</p>
        <p>Your submission for project <strong>{{PROJECT_NAME}}</strong> has been reviewed.</p>

        <span class="badge {{STATUS_CLASS}}">{{STATUS_LABEL}}</span>

        <div class="detail-card">
          <p class="detail-row"><strong>Document:</strong> {{DOCUMENT_NAME}}</p>
        </div>

        {{FEEDBACK_BLOCK}}

        <p>{{STATUS_MESSAGE}}</p>

        <div class="email-divider"></div>

        <p class="signature">Regards,<br><strong>The DocsNDocs Team</strong></p>
      </div>

      <div class="email-footer">
        <p>&copy; 2025 DocsNDocs, Inc. All rights reserved.</p>
        <p><a href="{{BASE_URL}}">docsndocs.com</a></p>
      </div>

    </div>
  </div>
</body>
</html>
