<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     version="1.2"
     baseProfile="tiny-ps"
     viewBox="0 0 512 512">
  <title>DocsNDocs</title>
  <desc>DocsNDocs document and approval mark</desc>
  <defs>
    <linearGradient id="documentGradient" x1="180" y1="55" x2="430" y2="405" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00dc68"/>
      <stop offset="0.58" stop-color="#00c866"/>
      <stop offset="1" stop-color="#00a878"/>
    </linearGradient>
    <linearGradient id="pageGradient" x1="72" y1="132" x2="309" y2="468" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#087df0"/>
      <stop offset="0.7" stop-color="#075ce1"/>
      <stop offset="1" stop-color="#064acb"/>
    </linearGradient>
    <linearGradient id="checkGradient" x1="315" y1="337" x2="408" y2="391" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00dc72"/>
      <stop offset="1" stop-color="#00c860"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="#ffffff"/>

  <!-- Rear document and folded corner -->
  <path d="M181 153V70c0-18 14-32 32-32h145c9 0 17 3 23 9l73 72c7 7 10 15 10 24v211c0 24-16 45-40 51l-177 45v-36l168-43c8-2 14-9 14-17V155h-43c-18 0-32-14-32-32V73H215v95z"
