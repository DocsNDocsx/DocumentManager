  <path d="M370 73v49c0 9 7 17 17 17h48z" fill="#00d568"/>

  <!-- Front page/folder silhouette -->
  <path fill="url(#pageGradient)" fill-rule="evenodd"
        d="M91 112c9 0 17 3 24 8l113 84c12 9 19 23 19 38v176l151-39v35l-178 46c-10 3-21 1-29-5L79 382c-13-9-20-24-20-40V157c0-25 13-45 32-45zm10 59c-4 0-7 4-7 10v151c0 8 3 15 10 19l91 61c4 3 7 1 7-5V252c0-7-3-13-9-17l-85-62c-2-1-5-2-7-2z"/>

  <!-- Document text lines -->
  <rect x="272" y="189" width="121" height="21" rx="11" fill="#064fcf"/>
  <rect x="272" y="235" width="121" height="21" rx="11" fill="#064fcf"/>
  <rect x="272" y="280" width="121" height="21" rx="11" fill="#064fcf"/>

  <!-- Approval check -->
  <path d="M319 349a12 12 0 0 1 17 0l11 11 40-40a12 12 0 1 1 17 17l-49 49a12 12 0 0 1-17 0l-19-20a12 12 0 0 1 0-17z"
