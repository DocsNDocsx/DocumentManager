<div class="brand-container">
  <app-logo [imageSize]="40" nColor="var(--primary-color)" routerLink="/" />
</div>

<div class="container-fluid p-0">
  <div class="row g-0 vh-100">
    <div class="col-md-6 d-none d-md-block">
      <img ngSrc="ImageForgotPassword.jpg" class="auth-side-image" fill priority alt="New Password" />
    </div>

    <div class="col-md-6 d-flex align-items-center justify-content-center">
      <div style="max-width: 450px; width: 80%">

        <h1>New Password</h1>
        <p class="text-muted mb-4">
          Please create a strong password to secure your account.
        </p>

        <form (submit)="onSubmit($event)">
          <div class="mb-3">
            <label class="form-label" for="password">New Password</label>
            <input
              [type]="showPasswords() ? 'text' : 'password'"
              id="password"
              class="form-control"
              required
              [value]="password()"
              (input)="onPasswordInput($event)"
            />
          </div>

          <div class="mb-3">
            <label class="form-label" for="confirm">Confirm Password</label>
            <input
              [type]="showPasswords() ? 'text' : 'password'"
              id="confirm"
              class="form-control"
              required
              [value]="confirmPassword()"
              (input)="onConfirmInput($event)"
            />
            @if (showMismatchError()) {
              <div class="text-danger small mt-1">
                Passwords do not match
              </div>
            }
          </div>

          <div class="form-check mb-3">
            <input
              type="checkbox"
              class="form-check-input"
              id="toggle"
              (change)="togglePasswords($event)"
            />
            <label class="form-check-label" for="toggle">Show Passwords</label>
          </div>

          <div class="password-requirements">
            @for (rule of ruleValidity(); track rule.id) {
              <div class="requirement" [class.valid]="rule.valid">
                <i [class]="rule.valid ? 'fas fa-check-circle' : 'fas fa-circle'"></i>
                {{ rule.label }}
              </div>
            }
          </div>

          <button
            class="btn-brand-orange"
            type="submit"
            [attr.disabled]="canSubmit() ? null : ''"
          >
            Reset Password
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
