<div class="signup-wrapper">
  <div class="panel-image">
    <img ngSrc="ImageSignIn.jpg" alt="Sign In" class="bg-img" fill priority />
    <div class="panel-image-content">
      <app-logo href="sign-in" ariaLabel="DocNDocs home" />
      <div class="panel-tagline">
        <h2>Forgot your<br />password?</h2>
        <p>Enter your email address and we'll send you a one-time code to reset it.</p>
        <app-trust-pills />
      </div>
    </div>
  </div>

  <div class="panel-form">
    <div class="mobile-logo">
      <app-logo href="sign-in" ariaLabel="DocsNDocs home" />
    </div>

    <div class="form-box">
      <h1>Reset Password</h1>
      <p>We'll send a 6-digit code to your email address.</p>

      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <input type="text" class="hidden-trap" tabindex="-1" autocomplete="off" aria-hidden="true" />

        <div class="form-group">
          <label class="form-label" for="emailField">Email Address</label>
          <div class="input-icon-wrap">
            <i class="fas fa-envelope input-icon"></i>
            <input
              type="email"
              class="form-control"
              id="emailField"
              formControlName="email"
              placeholder="jane@example.com"
              maxlength="100"
              autocomplete="email"
            />
          </div>
        </div>

        @if (errorMessage()) {
          <div class="form-error" role="alert" aria-live="polite">
            {{ errorMessage() }}
          </div>
        }

        <div class="form-group" style="margin-top: 1.8rem">
          <button type="submit" class="btn-signup" [disabled]="isLoading()">
            {{ isLoading() ? 'Sending…' : 'Send Reset Code' }}
          </button>
        </div>
      </form>

      <p class="bottom-links">
        <a href="sign-in">Back to Sign In</a>
        <span class="divider" aria-hidden="true">|</span>
        <a href="sign-up">New here? Sign Up</a>
      </p>
    </div>
  </div>
</div>
