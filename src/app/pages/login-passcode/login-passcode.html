<main class="verification-page">
  <section class="verification-card" aria-labelledby="loginVerificationTitle">
    <app-logo routerLink="/" [imageWidth]="180" [imageHeight]="50" variant="dark" />
    <div class="shield"><i class="fas fa-shield-alt" aria-hidden="true"></i></div>
    <h1 id="loginVerificationTitle">Verify your new device</h1>
    <p>We sent a six-digit pass-code to <strong>{{ email() }}</strong>.</p>
    <form (submit)="submit($event)" autocomplete="off">
      <label for="loginPasscode">Passcode</label>
      <input id="loginPasscode" type="text" inputmode="numeric" autocomplete="one-time-code"
        maxlength="6" placeholder="000000" [value]="passcode()" (input)="onInput($event)" autofocus />
      @if (errorMessage()) { <p class="error" role="alert">{{ errorMessage() }}</p> }
      <button class="verify-button" type="submit" [disabled]="isSubmitting()">
        {{ isSubmitting() ? 'Verifying…' : 'Verify and sign in' }}
      </button>
    </form>
    <div class="resend">
      @if (canResend()) { <button type="button" (click)="resend()">Resend code</button> }
      @else { <span>Resend code in {{ secondsLeft() }}s</span> }
    </div>
    <a class="back-link" routerLink="/sign-in"><i class="fas fa-arrow-left" aria-hidden="true"></i> Back to sign in</a>
  </section>
</main>
