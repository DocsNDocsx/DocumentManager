<a
  class="logo"
  [routerLink]="routerLink()"
  [attr.href]="routerLink() ? null : href()"
  [attr.aria-label]="ariaLabel()"
>
  <img
    [ngSrc]="variant() === 'light' ? 'docsndocslogo-light-v2.png' : 'docsndocslogo-dark.png'"
    alt="DocsNDocs logo"
    [width]="imageWidth() || imageSize() * 3"
    [height]="imageHeight() || imageSize()"
    priority
  />
</a>
