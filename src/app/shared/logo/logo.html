<a
  class="logo"
  [routerLink]="routerLink()"
  [attr.href]="routerLink() ? null : href()"
  [attr.aria-label]="ariaLabel()"
>
  @if (showImage()) {
    <img
      ngSrc="docsndocslogo-transparent.png"
      alt="DocsNDocs logo"
      [width]="imageWidth() || imageSize() * 3"
      [height]="imageHeight() || imageSize()"
      priority
    />
  } @else {
    <div><span class="logo-docs-1">Doc</span><span class="logo-n" [style.color]="nColor() || null">N</span><span class="logo-docs-2">Docs</span></div>
  }
</a>
