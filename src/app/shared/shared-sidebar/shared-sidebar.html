<div class="sidebar-header">
  <button
    class="sidebar-toggle"
    type="button"
    (click)="toggle()"
    title="Toggle Menu"
    [attr.aria-expanded]="!collapsed()"
  >
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="3" y="3" width="18" height="18" rx="2.5"/>
      <line x1="9" y1="3" x2="9" y2="21"/>
    </svg>
  </button>
</div>

<nav class="sidebar-nav">

  <div class="nav-section">
    <span class="section-label">Projects</span>
    <ul role="list">
      <li>
        <a routerLink="/left-menu-new-solo-project-landing" routerLinkActive="active">
          <i class="fas fa-user-plus" aria-hidden="true"></i>
          <span class="menu-text">New Solo Project</span>
        </a>
      </li>
      @if (teamsEnabled) {
        <li>
          <a routerLink="/left-menu-create-new-team" routerLinkActive="active">
            <i class="fas fa-users-cog" aria-hidden="true"></i>
            <span class="menu-text">New Team</span>
          </a>
        </li>
        <li>
          <a routerLink="/left-menu-new-team-project-landing" routerLinkActive="active">
            <i class="fas fa-folder-plus" aria-hidden="true"></i>
            <span class="menu-text">New Team Project</span>
          </a>
        </li>
      }
      <li>
        <a routerLink="/left-menu-add-external-project" routerLinkActive="active">
          <i class="fas fa-file-import" aria-hidden="true"></i>
          <span class="menu-text">Join External Project</span>
        </a>
      </li>
    </ul>
  </div>

  <div class="nav-section">
    <span class="section-label">Activity</span>
    <ul role="list">
      <li>
        <a routerLink="/check-submissions" routerLinkActive="active">
          <i class="fas fa-inbox" aria-hidden="true"></i>
          <span class="menu-text">Check Submissions</span>
        </a>
      </li>
    </ul>
  </div>

</nav>

<div class="sidebar-footer">
  <ul role="list">
    <li>
      <a routerLink="/pricing-plan" routerLinkActive="active">
        <i class="fas fa-tags" aria-hidden="true"></i>
        <span class="menu-text">Pricing</span>
      </a>
    </li>
    <li>
      <button type="button" class="signout-link" (click)="signOut()">
        <i class="fas fa-sign-out-alt" aria-hidden="true"></i>
        <span class="menu-text">Sign Out</span>
      </button>
    </li>
  </ul>
</div>
